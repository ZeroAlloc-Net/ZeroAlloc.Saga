name: build
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Codecov upload via OIDC, no token secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # Installs the SDK global.json pins. Without it the job never installs
          # that SDK at all and only works when the runner image happens to ship one
          # satisfying the pin, which is how a publish failed on a lagging image.
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore ZeroAlloc.Saga.slnx
      - run: dotnet build ZeroAlloc.Saga.slnx --configuration Release --no-restore
      # --collect "XPlat Code Coverage" makes vstest load coverlet's in-proc collector,
      # which writes every module's hits when the test session ends. With the runsettings
      # file alone, hits are written only by ProcessExit handlers, and vstest kills a test
      # host that has not exited 100 ms after the run, so a module can read 0 at random.
      - run: dotnet test ZeroAlloc.Saga.slnx --configuration Release --no-build --verbosity normal --collect "XPlat Code Coverage" --settings coverage.runsettings --results-directory TestResults

      # Merges the Cobertura reports and fails below the line coverage floor, or when codecov.yml would let a drop in
      # coverage pass quietly. Shared from ci-baseline, pinned to the moving v1 tag.
      - name: Coverage gate
        uses: MarcelRoozekrans/ci-baseline/actions/coverage-gate@v1
        with:
          reports: TestResults/**/coverage.cobertura.xml

      - name: Upload coverage to Codecov
        if: '!cancelled()'
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: "TestResults/**/coverage.cobertura.xml"
          disable_search: true   # only the files above, not every *.xml the search finds
          fail_ci_if_error: false

  api-compat:
    uses: ZeroAlloc-Net/.github/.github/workflows/api-compat.yml@main

  # A release PR must mark everything it releases as shipped: the analyzer rules in
  # AnalyzerReleases.Unshipped.md and the API in every PublicAPI.Unshipped.txt. The
  # ship-release-tracking job in release-please.yml commits that move onto the branch;
  # this fails the PR if the move is missing, or if a later commit on the branch adds
  # entries after it. Shared from ZeroAlloc-Net/.github; see ZeroAlloc-Net/.github#38.
  release-tracking:
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--') }}
    uses: ZeroAlloc-Net/.github/.github/workflows/release-tracking.yml@main
