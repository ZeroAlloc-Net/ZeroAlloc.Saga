name: aot-smoke
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  aot-smoke:
    name: publish + run AotSmoke (linux-x64)
    runs-on: ubuntu-latest
    # Typical run is about a minute; a hang must fail fast, not burn the 6h default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # Installs the SDK global.json pins. Without it the job never installs
          # that SDK at all and only works when the runner image happens to ship one
          # satisfying the pin, which is how a publish failed on a lagging image.
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            10.0.x
      # Restore the whole solution so the saga generator + its analyzer
      # ProjectReference resolve before AotSmoke is published.
      - name: Restore solution
        run: dotnet restore ZeroAlloc.Saga.slnx
      # Publish AotSmoke with native AOT enabled. PublishAot=true is set in
      # AotSmoke.csproj itself, NOT on the command line — the command-line
      # form propagates to ProjectReference dependencies and makes the
      # netstandard2.0 generator csproj try to AOT-compile (NETSDK1207).
      # Any trim warnings will fail the build because the runtime project
      # enables EnableTrimAnalyzer + AOT analysers; we explicitly do not
      # suppress.
      - name: Publish AotSmoke
        run: dotnet publish samples/AotSmoke/AotSmoke.csproj -c Release -o aot-out
      # Run the AOT-published binary and assert exit code 0 (saga reaches
      # Completed and is removed from the store).
      - name: Run AotSmoke
        # GNU timeout exits 124 if the binary hangs, e.g. dotnet/runtime#134799.
        run: timeout --kill-after=10s 120s ./aot-out/AotSmoke

  aot-smoke-efcore:
    name: build + run AotSmokeEfCore (linux-x64, EfCore backend)
    runs-on: ubuntu-latest
    # Typical run is about a minute; a hang must fail fast, not burn the 6h default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # Installs the SDK global.json pins. Without it the job never installs
          # that SDK at all and only works when the runner image happens to ship one
          # satisfying the pin, which is how a publish failed on a lagging image.
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore solution
        run: dotnet restore ZeroAlloc.Saga.slnx
      # AotSmokeEfCore.csproj enables IsAotCompatible=true +
      # EnableTrimAnalyzer + EnableSingleFileAnalyzer so AOT-hostile
      # patterns surface as build errors here. PublishAot=true is NOT set
      # because EF Core 9.0's NativeAOT story still requires precompiled
      # queries that don't yet cover the dynamic LINQ expressions inside
      # ZeroAlloc.Saga.EfCore's store. A truly-AOT-published binary today
      # would throw "Query wasn't precompiled and dynamic code isn't
      # supported (NativeAOT)" at runtime; once EF Core's AOT support
      # matures (post-10.0) the publish + run pattern from the InMemory
      # job above is the target shape here too.
      #
      # In the meantime this job still adds value: the build runs all
      # AOT/trim analyzers, and the runtime smoke proves the EfCore
      # backend wires correctly with the saga generator's emitted
      # handlers (forward path + RowVersion rotation + row removal on
      # Completed).
      - name: Build AotSmokeEfCore
        run: dotnet build samples/AotSmokeEfCore/AotSmokeEfCore.csproj -c Release
      - name: Run AotSmokeEfCore
        run: timeout --kill-after=10s 180s dotnet run --project samples/AotSmokeEfCore/AotSmokeEfCore.csproj -c Release --no-build

  aot-smoke-outbox:
    name: publish + run AotSmokeOutbox (linux-x64, outbox bridge)
    runs-on: ubuntu-latest
    # Typical run is about a minute; a hang must fail fast, not burn the 6h default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # Installs the SDK global.json pins. Without it the job never installs
          # that SDK at all and only works when the runner image happens to ship one
          # satisfying the pin, which is how a publish failed on a lagging image.
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore solution
        run: dotnet restore ZeroAlloc.Saga.slnx
      # Empirically verify the outbox bridge under trimming: With{Saga}() registers
      # the generated GeneratedSagaCommandSource, which references
      # ZeroAlloc.Saga.Generated.SagaCommandRegistry directly, so the registry
      # survives trimming with no reflection or rooting attribute. PublishAot=true
      # is set in AotSmokeOutbox.csproj itself (not on the command line — same
      # reasoning as AotSmoke). The published binary runs a real host:
      # WithOutbox()'s startup check, then ZeroAlloc.Outbox's OutboxWorkerService
      # dispatching saga step → outbox enqueue → worker claim → registry
      # deserialize → mediator, for class and struct step commands alike.
      # Exit code 0 is the load-bearing assertion.
      - name: Publish AotSmokeOutbox
        run: dotnet publish samples/AotSmokeOutbox/AotSmokeOutbox.csproj -c Release -o aot-out-outbox
      - name: Run AotSmokeOutbox
        # GNU timeout exits 124 if the binary hangs, e.g. dotnet/runtime#134799.
        run: timeout --kill-after=10s 120s ./aot-out-outbox/AotSmokeOutbox

  # Every job below publishes with PublishAot=true set in the sample's csproj. Directory.Build.props
  # sets TreatWarningsAsErrors, which the ILCompiler targets turn into --warnaserror, so a trim or
  # AOT warning in any package the sample reaches fails the publish.
  aot-smoke-resilience:
    name: publish + run ResilienceSample (linux-x64, resilience bridge)
    runs-on: ubuntu-latest
    # Typical run is about a minute; a hang must fail fast, not burn the 6h default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # Installs the SDK global.json pins. Without it the job never installs
          # that SDK at all and only works when the runner image happens to ship one
          # satisfying the pin, which is how a publish failed on a lagging image.
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore solution
        run: dotnet restore ZeroAlloc.Saga.slnx
      # Retries a flaky receiver through ZeroAlloc.Saga.Resilience's decorator, which builds a
      # type-registered inner dispatcher with ActivatorUtilities. Needs no external service.
      - name: Publish ResilienceSample
        run: dotnet publish samples/ResilienceSample/ResilienceSample.csproj -c Release -o aot-out-resilience
      - name: Run ResilienceSample
        run: timeout --kill-after=10s 120s ./aot-out-resilience/ResilienceSample

  aot-smoke-orm:
    name: publish + run AotSmokeOrm (linux-x64, ORM store + ORM outbox)
    runs-on: ubuntu-latest
    # Typical run is about a minute; a hang must fail fast, not burn the 6h default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # Installs the SDK global.json pins. Without it the job never installs
          # that SDK at all and only works when the runner image happens to ship one
          # satisfying the pin, which is how a publish failed on a lagging image.
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore solution
        run: dotnet restore ZeroAlloc.Saga.slnx
      # ZeroAlloc.Saga.Orm and ZeroAlloc.Saga.Outbox.Orm against a SQLite file: migrations, the
      # saga row's insert, update and delete, and the outbox rows written in the same
      # transaction and dispatched by the worker. SQLite is in-process, so the binary runs here.
      - name: Publish AotSmokeOrm
        run: dotnet publish samples/AotSmokeOrm/AotSmokeOrm.csproj -c Release -o aot-out-orm
      - name: Run AotSmokeOrm
        run: timeout --kill-after=10s 120s ./aot-out-orm/AotSmokeOrm

  aot-smoke-redis:
    name: publish AotSmokeRedis (linux-x64, Redis store + Redis outbox)
    runs-on: ubuntu-latest
    # Typical run is about a minute; a hang must fail fast, not burn the 6h default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # Installs the SDK global.json pins. Without it the job never installs
          # that SDK at all and only works when the runner image happens to ship one
          # satisfying the pin, which is how a publish failed on a lagging image.
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore solution
        run: dotnet restore ZeroAlloc.Saga.slnx
      # ZeroAlloc.Saga.Redis and ZeroAlloc.Saga.Outbox.Redis. Publish only: running needs a Redis
      # server, which this smoke deliberately does not depend on. The publish still compiles
      # every Redis code path Main reaches through ILC with warnings as errors. Run the binary
      # locally with REDIS_CONNECTION=host:port for the full round trip.
      - name: Publish AotSmokeRedis
        run: dotnet publish samples/AotSmokeRedis/AotSmokeRedis.csproj -c Release -o aot-out-redis
