name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Release Please
        uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore ZeroAlloc.Saga.slnx

      - name: Build
        run: dotnet build ZeroAlloc.Saga.slnx -c Release --no-restore -p:Version=${{ needs.release-please.outputs.version }}

      - name: Test
        run: dotnet test ZeroAlloc.Saga.slnx -c Release --no-build

      # One version covers every package, so ProjectReference dependencies between them stamp
      # correctly: Saga.EfCore at X depends on ZeroAlloc.Saga X. Under the old per-package
      # versions, -p:PackageVersion applied globally and each sibling stamped its OWN number
      # onto that dependency -- EfCore 1.3.0 shipped "depends on ZeroAlloc.Saga 1.3.0". See #98.
      - name: Pack all packages at the release version
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$VERSION" ]; then
            echo "::error::release-please reported a release but produced no version"
            exit 1
          fi
          mkdir -p ./nupkg
          for csproj in src/*/*.csproj; do
            if ! grep -q "<IsPackable>true</IsPackable>" "$csproj"; then
              echo "Skipping $csproj (not packable)"
              continue
            fi
            echo "Packing $csproj at $VERSION"
            dotnet pack "$csproj" -c Release --no-build -p:PackageVersion="$VERSION" -o ./nupkg
          done
          ls -la ./nupkg
          # Releasing nothing while reporting success is the failure mode #98 is about.
          if ! ls ./nupkg/*.nupkg >/dev/null 2>&1; then
            echo "::error::no packages were produced"
            exit 1
          fi

      - name: Push to NuGet
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
