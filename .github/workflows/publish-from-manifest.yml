name: Publish from manifest

# Manually-triggered rescue workflow that packs and pushes each package to NuGet
# at the version recorded in .release-please-manifest.json. Useful when the
# Release Please workflow's tag-and-publish race fails partway through (e.g. a
# missing version.txt block) leaving GitHub releases tagged but NuGet
# unpublished. --skip-duplicate makes re-runs safe.
#
# Usage:  gh workflow run publish-from-manifest.yml --repo ZeroAlloc-Net/ZeroAlloc.Saga

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          # Installs the SDK global.json pins. Without it the job never installs
          # that SDK at all and only works when the runner image happens to ship one
          # satisfying the pin, which is how a publish failed on a lagging image.
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore ZeroAlloc.Saga.slnx

      - name: Build
        run: dotnet build ZeroAlloc.Saga.slnx -c Release --no-restore

      - name: Test
        run: dotnet test ZeroAlloc.Saga.slnx -c Release --no-build

      - name: Pack each package at manifest version
        run: |
          mkdir -p ./nupkg
          # Walk every path in the release-please manifest and pack at the recorded version.
          # Falls back to version.txt if the manifest entry is somehow stale.
          jq -r 'to_entries[] | "\(.key) \(.value)"' .release-please-manifest.json | \
            while read path version; do
              csproj=$(ls "$path"/*.csproj | head -1)
              echo "Packing $csproj at version $version"
              # No --no-build, and -p:Version rather than -p:PackageVersion alone. Each
              # project carries its own manifest version here, so the solution cannot be
              # stamped once up front; packing must rebuild the project at its own version
              # or the assembly keeps a fallback while the package claims the real one.
              # See ZeroAlloc-Net/.github#26.
              dotnet pack "$csproj" -c Release \
                -p:Version="$version" -o ./nupkg
            done
          ls -la ./nupkg

      - name: Push to NuGet
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
