name: Publish from manifest

# Manually-triggered rescue workflow that packs and pushes each package to NuGet
# at the version recorded in .release-please-manifest.json. Useful when the
# Release Please workflow fails partway through, leaving a GitHub release tagged
# but NuGet unpublished. --skip-duplicate makes re-runs safe.
#
# Usage:  gh workflow run publish-from-manifest.yml --repo ZeroAlloc-Net/ZeroAlloc.Saga

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          # Installs the SDK global.json pins. Without it the job never installs
          # that SDK at all and only works when the runner image happens to ship one
          # satisfying the pin, which is how a publish failed on a lagging image.
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Read manifest version
        id: version
        run: |
          set -euo pipefail
          # The manifest has a single "." component: every package ships at one version.
          version=$(jq -r '.["."] // empty' .release-please-manifest.json)
          if [ -z "$version" ]; then
            echo "::error::.release-please-manifest.json has no version for the \".\" component"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Manifest version: $version"

      - name: Restore
        run: dotnet restore ZeroAlloc.Saga.slnx

      # -p:Version must be passed HERE, not only to pack. The pack step below runs
      # --no-build, so a build without it leaves every assembly stamped with a fallback
      # version. The release version guard fails that pack. See ZeroAlloc-Net/.github#26.
      - name: Build
        run: dotnet build ZeroAlloc.Saga.slnx -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test ZeroAlloc.Saga.slnx -c Release --no-build

      # Same selection and command as release-please.yml, so a rescue publishes exactly
      # what a normal release would have.
      - name: Pack all packages at the manifest version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p ./nupkg
          for csproj in src/*/*.csproj; do
            if ! grep -q "<IsPackable>true</IsPackable>" "$csproj"; then
              echo "Skipping $csproj (not packable)"
              continue
            fi
            echo "Packing $csproj at $VERSION"
            dotnet pack "$csproj" -c Release --no-build -p:PackageVersion="$VERSION" -o ./nupkg
          done
          ls -la ./nupkg
          if ! ls ./nupkg/*.nupkg >/dev/null 2>&1; then
            echo "::error::no packages were produced"
            exit 1
          fi

      - name: Push to NuGet
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
