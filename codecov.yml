# Codecov: the project status is the ci-baseline v1 drop check and must stay as it is; the
# coverage gate in build.yml refuses a weaker one. The patch status is informational and
# outside the baseline, so it may stay.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 80%
        informational: true

comment:
  layout: "condensed_header, diff, files"
  require_changes: true

ignore:
  - "tests/**"
  - "benchmarks/**"
  - "samples/**"
  - "**/obj/**"
  - "**/*.g.cs"
